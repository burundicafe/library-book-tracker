{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ book.title }} - Details</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>

    {% if messages %}
        <div id="toast-container" class="toast-container">
            {% for message in messages %}
                <div class="toast-box">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
        <script>
            setTimeout(function() {
                var container = document.getElementById('toast-container');
                if (container) {
                    container.classList.add('fade-out');
                    setTimeout(function() { container.remove(); }, 500);
                }
            }, 3000);
        </script>
    {% endif %}

    <div class="layout-wrapper" style="max-width: 600px;"> <div class="header-container search-header-reverse">
            <div class="nav-container nav-left">
                <a href="{% url 'index' %}" class="back-button">← Library</a>
            </div>
            <h1 class="main-header">Edit Book Details</h1>
        </div>

        <div class="form-container">
            <form method="POST">
                {% csrf_token %}
                
                <div class="form-group">
                    <label for="title">Book Title</label>
                    <input type="text" id="title" name="title" class="form-input" value="{{ book.title }}" required>
                </div>

                <div class="form-group">
                    <label for="author">Author</label>
                    <input type="text" id="author" name="author" class="form-input" value="{{ book.author }}" required>
                </div>

                <div class="form-group">
                    <label for="publisher">Publisher</label>
                    <input type="text" id="publisher" name="publisher" class="form-input" value="{{ book.publisher }}">
                </div>

                <div class="form-group">
                    <label for="year_published">Year Published</label>
                    <input type="number" id="year_published" name="year_published" class="form-input" value="{{ book.year_published }}">
                </div>

                <div class="form-group">
                    <label for="notes">Book Notes</label>
                    <textarea id="notes" name="notes" class="form-input" rows="5" style="resize: vertical; font-family: inherit;" placeholder="Enter specific edition data, translation records, or personal thoughts...">{{ book.notes|default:'' }}</textarea>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="read" name="read" class="checkbox-input" {% if book.read %}checked{% endif %}>
                    <label for="read">Mark as Read</label>
                </div>

                <button type="submit" class="save-button">Save Changes</button>
            </form>
        </div>

    </div>
</body>
</html>
